[project]
name = "outage-explorer"
version = "0.1.0"
description = "Connector, data model and API for EIA nuclear outage data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
]

[project.scripts]
outage-extract = "outage_explorer.connector.cli:main"
outage-model = "outage_explorer.model.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outage_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Builds SQL from our own quoted column names only; see the comment in upsert_window.
"src/outage_explorer/connector/storage.py" = ["S608"]
# Same: table and column names come from model/tables.py, never from user input.
"src/outage_explorer/model/*.py" = ["S608"]
